name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: make check
        run: make check

      # The generated code is committed, so a .proto change that was not
      # regenerated has to fail the build rather than drift silently.
      - name: generated code is up to date
        run: |
          make proto
          git diff --exit-code
