name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: make check
        run: make check

      # From phase 3 on this job also runs `make proto` and fails if
      # `git diff --exit-code` shows changes in gen/.
